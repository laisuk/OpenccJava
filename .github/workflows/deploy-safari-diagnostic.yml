name: Temporarily deploy Safari diagnostic

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-safari-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Add the diagnostic to the verified Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13549993543/zip" > baseline.zip
          echo '48c2fb851d682a72ca472633a212e92e8deea91f5fbdf1acedcadef5ea27f381  baseline.zip' | sha256sum --check
          unzip -p baseline.zip artifact.tar > baseline.tar
          mkdir pages
          tar -xf baseline.tar -C pages
          cp openccjavawasm/src/main/web/js-startup-diagnostics.html pages/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - uses: actions/deploy-pages@v5
        id: pages
