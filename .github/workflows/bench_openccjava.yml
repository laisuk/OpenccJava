name: OpenccJava Benchmark

on:
  workflow_dispatch:
#  push:
#    branches: [ main ]
#    paths:
#      - 'openccjava/**'
#      - 'bench/**'
#      - '.github/workflows/bench_openccjava.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 🔨 Build openccjava
        run: ./gradlew :openccjava:build -x test

      - name: 🖥 System Info
        run: |
          echo "CPU Info:"
          lscpu
          echo ""
          echo "Memory Info:"
          free -h

      - name: 🚀 Run benchmark
        shell: bash
        run: |
          set -euo pipefail
          OPENCCJAVA_VERSION="$(./gradlew -q :openccjava:properties | sed -n 's/^version: //p' | head -n 1)"
          : "${OPENCCJAVA_VERSION:?Unable to determine OpenccJava version from Gradle}"

          {
            echo "OpenccJava version: ${OPENCCJAVA_VERSION}"
            echo "Java runtime: $(java -version 2>&1 | head -n 1)"
            echo "Git commit: $(git rev-parse --short HEAD)"
            echo ""
            echo "========================================"
            echo ""
          } | tee bench_result.txt

          ./gradlew -q :openccjava:runOpenccBench | tee -a bench_result.txt

      - name: 📊 Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: openccjava-benchmark
          path: bench_result.txt
