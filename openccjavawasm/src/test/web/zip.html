<!doctype html><meta charset="utf-8"><pre id="status">Testing ZIP…</pre>
<script type="module">
import adapter from './openccJavaAdapter.js';
try {
    await adapter.initialize();
    const api = adapter.getBackend() === 'js' ? await import('./js/openccjava.js')
        : (await TeaVM.wasmGC.load('./wasm-gc/openccjava.wasm')).exports;
    const fixture = await (await fetch('./zip-fixture.json')).json();
    const input = Int8Array.from(atob(fixture.bytes), c => c.charCodeAt(0));
    const output = api.roundTripZip(input);
    if (!output) throw new Error(api.getLastError());
    const bytes = new Uint8Array(output.buffer, output.byteOffset, output.byteLength);
    window.packageResults = [{name: 'roundtrip.zip', bytes: btoa(String.fromCharCode(...bytes))}];
    document.documentElement.dataset.zip = 'passed';
    document.getElementById('status').textContent = `${adapter.getBackend()}: real ZIP round trip returned ${bytes.length} bytes`;
} catch (error) {
    document.documentElement.dataset.zip = 'failed';
    document.getElementById('status').textContent = String(error);
}
</script>
